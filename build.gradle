plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'ua.music.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    defaultCharacterEncoding = 'UTF-8'
}

repositories {
    mavenCentral()
}
dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.17'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.register('benchmark', JavaExec) {
    group = 'application'
    description = 'Compare repository and linear search over 100000 artists'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ua.music.repository.SearchBenchmark'
    systemProperty 'logback.configurationFile', file('src/main/resources/logback-benchmark.xml').absolutePath
}
